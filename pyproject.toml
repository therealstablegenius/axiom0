[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom0-living-city"
readme = "README.md"
version = "0.6.0"
description = "Local-first municipal occurrence intelligence built on the AXIOM0 numerical substrate"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "fastapi>=0.110", "uvicorn>=0.30", "pydantic>=2", "tzdata>=2024.1", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
render = ["playwright>=1.49"]

[project.scripts]
axiom0 = "axiom0.cli:execute"

[tool.setuptools.packages.find]
include = ["axiom0*"]

[tool.setuptools.package-data]
axiom0 = ["web/*.html"]

